kind = "mobile"
previewPath = "/"
title = "Food Delivery"
description = "A React Native food delivery app that helps people discover nearby restaurants and manage a shopping cart."
version = "1.0.0"
id = "artifacts/food-delivery"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22312

[services.development]
run = "pnpm --filter @workspace/food-delivery run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/food-delivery", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/food-delivery", "run", "serve" ]

[services.env]
PORT = "22312"
BASE_PATH = "/"
