spring.application.name=subifood-ai
# Support IntelliJ opened at either the repository root or the ai-service module.
spring.config.import=optional:file:./ai-service/.env.properties,optional:file:./.env.properties
server.address=0.0.0.0
server.port=${PORT:3002}
server.error.include-message=never
server.error.include-stacktrace=never
spring.ai.google.genai.api-key=${GEMINI_API_KEY:not-configured}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:not-configured}
spring.ai.google.genai.chat.model=${GEMINI_CHAT_MODEL:gemini-3.1-flash-lite}
spring.ai.google.genai.chat.temperature=0.1
spring.ai.google.genai.chat.thinking-level=LOW
spring.ai.google.genai.chat.include-thoughts=true
spring.ai.google.genai.chat.max-output-tokens=1024
spring.ai.google.genai.chat.google-search-retrieval=false
spring.ai.google.genai.chat.enable-cached-content=false
spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
spring.ai.google.genai.embedding.text.dimensions=1536
# Bound transient retries; daily Gemini quota still uses the embedding cooldown.
spring.ai.retry.max-attempts=5
spring.ai.retry.backoff.initial-interval=2s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=8s
spring.ai.retry.on-client-errors=false
spring.ai.retry.exclude-on-http-codes=400,401,403,404,429
app.ai.enabled=${AI_ENABLED:false}
app.ai.gemini-api-key=${GEMINI_API_KEY:}
app.ai.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
app.ai.supabase-url=${SUPABASE_URL:https://glchegbogadnllehcnzf.supabase.co}
app.ai.public-key=${SUPABASE_PUBLIC_KEY:}
app.ai.service-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.ai.index-enabled=${AI_INDEX_ENABLED:false}
app.ai.index-batch-size=${AI_INDEX_BATCH_SIZE:5}
app.ai.min-similarity=${AI_MIN_SIMILARITY:0.62}
app.ai.index-delay-ms=${AI_INDEX_DELAY_MS:60000}
app.ai.allowed-origins=${AI_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8093}
