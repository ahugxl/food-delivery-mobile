<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, Arial" font-size="24" data-pptx-page-role="content" role="img" aria-labelledby="soopi-arch-title soopi-arch-desc" id="soopifood-architecture-root">
<title id="soopi-arch-title">Kiến trúc hệ thống soopiFood</title>
<desc id="soopi-arch-desc">App khách và app tài xế truy cập Supabase qua HTTPS và Realtime. Web admin dùng API Node.js Express. Backend Spring AI xác thực bằng Supabase, gọi Gemini, tìm vector và kiểm tra dữ liệu qua RPC. PostgreSQL và pgvector lưu nghiệp vụ và vector. Admin upload ảnh S3 lên Backblaze B2, app nhận ảnh qua Cloudflare CDN.</desc>
